name: Build APK

on:
  push:
    branches: [main, master, fongmi-kernel]
  workflow_dispatch:
    branches: [fongmi-kernel]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    env:
      MPV_GIT_URL: https://github.com/FongMi/mpv
      MPV_GIT_REF: fongmi
      MPV_ANDROID_ARCHES: armv7l arm64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkg-config libtool ninja-build cmake unzip wget gperf
          pip3 install meson

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew buildscripts/include/ci.sh buildscripts/buildall.sh buildscripts/download.sh

      - name: Build native libraries (FongMi/mpv kernel)
        run: |
          export ANDROID_HOME=$PWD/buildscripts/sdk/android-sdk-linux
          buildscripts/include/ci.sh install
          MPV_ANDROID_NATIVE_ONLY=1 buildscripts/include/ci.sh build

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME=$PWD/buildscripts/sdk/android-sdk-linux
          export ANDROID_SDK_ROOT=$PWD/buildscripts/sdk/android-sdk-linux
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build defaultDebug APK
        run: |
          export ANDROID_HOME=$PWD/buildscripts/sdk/android-sdk-linux
          export ANDROID_SDK_ROOT=$PWD/buildscripts/sdk/android-sdk-linux
          ./gradlew assembleDefaultDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mpvex-debug
          path: app/build/outputs/apk/default/debug/*.apk

      - name: Build defaultRelease APK
        run: |
          export ANDROID_HOME=$PWD/buildscripts/sdk/android-sdk-linux
          export ANDROID_SDK_ROOT=$PWD/buildscripts/sdk/android-sdk-linux
          ./gradlew assembleDefaultRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: mpvex-release
          path: app/build/outputs/apk/default/release/*.apk

      - name: Create GitHub Release (v7a + v8a)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          TAG="v${VERSION}-fongmi-r${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/default/release/*.apk \
            -R qznet/mpvEx-TV \
            --title "mpv NAS Player ${VERSION} (FongMi kernel) build ${{ github.run_number }}" \
            --notes "Source-built FongMi/mpv kernel (fongmi branch), armeabi-v7a + arm64-v8a. Built from $(git rev-parse --short HEAD)."

      - name: Skip release on push (manual Run workflow required)
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "Push-triggered build: artifacts uploaded, no release. Use Actions > Run workflow for a release."

name: Build APK

on:
  push:
    branches: [main, master, fongmi-kernel]
  workflow_dispatch:
    branches: [fongmi-kernel]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write
      actions: write

    env:
      MPV_GIT_REF: fongmi
      # Pin a known-good kernel commit for reproducible builds. The fongmi branch
      # HEAD broke the native build on 2026-08-25/26: player/playloop.c calls
      # update_vo_chain_el_pair(), which is no longer declared (FongMi/mpv commit
      # c318236b8882 "player: drop the enhancement-layer pairing when the media
      # has no EL" missed a call site). 654e9382c0bbccb09ccac348f792e9d378e9c7a9
      # is the last fongmi HEAD proven to compile (it was used by the successful
      # 234b91c build). Bump this once upstream fongmi restores a working
      # playloop.c. ci.sh honors MPV_GIT_COMMIT over MPV_GIT_REF.
      MPV_GIT_COMMIT: 654e9382c0bbccb09ccac348f792e9d378e9c7a9
      # On push (auto): build v7a only — fast CI for device sideload.
      # On workflow_dispatch (manual): build full v8a + v7a.
      MPV_APK_ABIS: ${{ github.event_name == 'workflow_dispatch' && 'armeabi-v7a,arm64-v8a' || 'armeabi-v7a' }}
      # On push: only armv7l to save CI time.
      # On workflow_dispatch: build both armv7l + arm64.
      MPV_ANDROID_ARCHES: ${{ github.event_name == 'workflow_dispatch' && 'armv7l arm64' || 'armv7l' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install native build dependencies
        run: |
          # Wrap apt-get update with a hard timeout so a hung mirror can't block the build for hours
          timeout 180 sudo apt-get update || echo "[warn] apt-get update timed out, falling back to cached package index"
          sudo apt-get install -y --no-install-recommends autoconf pkg-config libtool ninja-build cmake unzip wget gperf
          pip3 install --break-system-packages meson || pip3 install meson || true

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew buildscripts/include/ci.sh buildscripts/buildall.sh buildscripts/download.sh

      - name: Build native libraries (FongMi/mpv kernel)
        run: |
          export ANDROID_HOME=$PWD/buildscripts/sdk/android-sdk-linux
          # Abort git fetches that stall below 1 KB/s for 30s so the retry loop can recover
          # instead of hanging until the 120-minute job timeout.
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30
          git config --global https.lowSpeedLimit 1000
          git config --global https.lowSpeedTime 30
          MAX_TRIES=3
          for i in $(seq 1 $MAX_TRIES); do
            echo "=== native install attempt $i/$MAX_TRIES ==="
            if buildscripts/include/ci.sh install; then
              echo "=== install ok ==="
              break
            fi
            echo "[warn] install attempt $i failed; cleaning partial state and retrying in 15s..."
            rm -rf deps/mpv prefix
            sleep 15
          done
          MPV_ANDROID_NATIVE_ONLY=1 buildscripts/include/ci.sh build

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME=$PWD/buildscripts/sdk/android-sdk-linux
          export ANDROID_SDK_ROOT=$PWD/buildscripts/sdk/android-sdk-linux
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build defaultDebug APK
        run: |
          export ANDROID_HOME=$PWD/buildscripts/sdk/android-sdk-linux
          export ANDROID_SDK_ROOT=$PWD/buildscripts/sdk/android-sdk-linux
          ./gradlew assembleDefaultDebug -PmpvArches="$MPV_APK_ABIS"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mpvex-debug
          path: app/build/outputs/apk/default/debug/*.apk

      - name: Build defaultRelease APK
        run: |
          export ANDROID_HOME=$PWD/buildscripts/sdk/android-sdk-linux
          export ANDROID_SDK_ROOT=$PWD/buildscripts/sdk/android-sdk-linux
          ./gradlew assembleDefaultRelease -PmpvArches="$MPV_APK_ABIS"

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: mpvex-release
          path: app/build/outputs/apk/default/release/*.apk

      - name: Create GitHub Release (v7a + v8a)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          TAG="v${VERSION}-fongmi-r${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/default/release/*.apk \
            -R qznet/mpvEx-TV \
            --title "mpv NAS Player ${VERSION} (FongMi kernel) build ${{ github.run_number }}" \
            --notes "Source-built FongMi/mpv kernel (fongmi branch), armeabi-v7a + arm64-v8a. Built from $(git rev-parse --short HEAD)."

      - name: Skip release on push (manual Run workflow required)
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "Push-triggered build: artifacts uploaded, no release. Use Actions > Run workflow for a release."

name: Build APK

on:
  push:
    branches: [main, master, fongmi-kernel, fongmi-kernel-passthrough]
    # Official releases: pushing a v* tag is the only branch-free way to get the
    # full ABI set plus a GitHub Release.
    tags: ['v*']
  workflow_dispatch:
    branches: [fongmi-kernel, fongmi-kernel-passthrough]
    inputs:
      full:
        description: 'Build arm64-v8a too and create a GitHub Release (leave unchecked for a v7a test build)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write
      actions: write

    env:
      MPV_GIT_REF: fongmi
      # Pin the EXACT fongmi kernel commit that the working 234b91c build used.
      # The 234b91c build (run 32862726612, 2026-08-25) was built against fongmi
      # HEAD f68eb0a6996d727d0184d8f47dd15f5a95004692 — its libmpv.so embeds
      # "mpv v0.41.0-dev-gf68eb0a69". The fongmi branch later broke the native
      # build at c318236b8882 (player/playloop.c: update_vo_chain_el_pair no
      # longer declared), so we must NOT float to the latest fongmi HEAD. An
      # earlier attempt pinned 654e9382c0bbccb09ccac348f792e9d378e9c7a9, but that
      # is an OLDER commit than f68eb0a69 and regressed mediacodec_embed subtitle
      # rendering on the user's device. ci.sh honors MPV_GIT_COMMIT over
      # MPV_GIT_REF.
      MPV_GIT_COMMIT: f68eb0a6996d727d0184d8f47dd15f5a95004692
      # ABI matrix policy (2026-10-24): day-to-day test builds ship armeabi-v7a
      # ONLY, because the TV is 32-bit and a second ABI doubles the native
      # build time. The full set (v7a + arm64) is produced only when explicitly
      # asked for: workflow_dispatch with inputs.full checked, or a v* tag push.
      MPV_APK_ABIS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.full) || startsWith(github.ref, 'refs/tags/v')) && 'armeabi-v7a,arm64-v8a' || 'armeabi-v7a' }}
      MPV_ANDROID_ARCHES: ${{ ((github.event_name == 'workflow_dispatch' && inputs.full) || startsWith(github.ref, 'refs/tags/v')) && 'armv7l arm64' || 'armv7l' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install native build dependencies
        run: |
          # Wrap apt-get update with a hard timeout so a hung mirror can't block the build for hours
          timeout 180 sudo apt-get update || echo "[warn] apt-get update timed out, falling back to cached package index"
          sudo apt-get install -y --no-install-recommends autoconf pkg-config libtool ninja-build cmake unzip wget gperf
          pip3 install --break-system-packages meson || pip3 install meson || true

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew buildscripts/include/ci.sh buildscripts/buildall.sh buildscripts/download.sh

      - name: Build native libraries (FongMi/mpv kernel)
        run: |
          export ANDROID_HOME=$PWD/buildscripts/sdk/android-sdk-linux
          # Abort git fetches that stall below 1 KB/s for 30s so the retry loop can recover
          # instead of hanging until the 120-minute job timeout.
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30
          git config --global https.lowSpeedLimit 1000
          git config --global https.lowSpeedTime 30
          # Outer retry wraps the FULL install+build sequence so a transient
          # tar/extract failure in EITHER phase (e.g. "Missing libiconv file",
          # run 33171727172) is recovered automatically instead of failing the job.
          MAX_TRIES=3
          build_ok=0
          for i in $(seq 1 $MAX_TRIES); do
            echo "=== native build attempt $i/$MAX_TRIES ==="
            # install with its own inner retry: dependency tarballs can fail to
            # download/extract on flaky mirrors.
            install_ok=0
            for j in 1 2 3; do
              echo "  -- install attempt $j --"
              if buildscripts/include/ci.sh install; then
                install_ok=1
                break
              fi
              echo "[warn] install attempt $j failed; cleaning partial state and retrying..."
              # ci.sh cd's into buildscripts/, so the real paths are under
              # buildscripts/ — NOT repo-root deps/mpv / prefix (that cleanup
              # was a no-op and made every retry die on "already exists").
              rm -rf buildscripts/deps/mpv buildscripts/prefix
              # ci.sh's "ln -sv $ANDROID_HOME sdk/android-sdk-linux" is not
              # idempotent: when the target dir already exists, ln drops a
              # nested self-link inside it. Remove artifacts so retries work.
              rm -f buildscripts/sdk/android-sdk-linux/android-sdk-linux
              sleep 10
            done
            if [ "$install_ok" -ne 1 ]; then
              echo "::error::native install failed after 3 attempts"
              exit 1
            fi
            if MPV_ANDROID_NATIVE_ONLY=1 buildscripts/include/ci.sh build; then
              echo "=== build ok ==="
              build_ok=1
              break
            fi
            echo "[warn] build attempt $i failed; cleaning partial state and retrying in 15s..."
            # A failed build (e.g. missing libiconv) must also wipe the partial
            # prefix/deps so the next attempt re-extracts cleanly.
            rm -rf buildscripts/deps/mpv buildscripts/prefix
            rm -f buildscripts/sdk/android-sdk-linux/android-sdk-linux
            sleep 15
          done
          if [ "$build_ok" -ne 1 ]; then
            echo "::error::native build failed after $MAX_TRIES attempts"
            exit 1
          fi

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME=$PWD/buildscripts/sdk/android-sdk-linux
          export ANDROID_SDK_ROOT=$PWD/buildscripts/sdk/android-sdk-linux
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build defaultDebug APK
        run: |
          export ANDROID_HOME=$PWD/buildscripts/sdk/android-sdk-linux
          export ANDROID_SDK_ROOT=$PWD/buildscripts/sdk/android-sdk-linux
          ./gradlew assembleDefaultDebug -PmpvArches="$MPV_APK_ABIS"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mpvex-debug
          path: app/build/outputs/apk/default/debug/*.apk

      - name: Build defaultRelease APK
        run: |
          export ANDROID_HOME=$PWD/buildscripts/sdk/android-sdk-linux
          export ANDROID_SDK_ROOT=$PWD/buildscripts/sdk/android-sdk-linux
          ./gradlew assembleDefaultRelease -PmpvArches="$MPV_APK_ABIS"

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: mpvex-release
          path: app/build/outputs/apk/default/release/*.apk

      - name: Create GitHub Release (v7a + v8a)
        if: (github.event_name == 'workflow_dispatch' && inputs.full) || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          TAG="v${VERSION}-fongmi-r${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/default/release/*.apk \
            -R qznet/mpvEx-TV \
            --title "mpvExTV ${VERSION} (FongMi kernel) build ${{ github.run_number }}" \
            --notes "Source-built FongMi/mpv kernel (fongmi branch), armeabi-v7a + arm64-v8a. Built from $(git rev-parse --short HEAD)."

      - name: Skip release (v7a test build)
        if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.full) || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          echo "Test build: armeabi-v7a artifact only, no release. Tick 'full' on Run workflow (or push a v* tag) for the complete set."

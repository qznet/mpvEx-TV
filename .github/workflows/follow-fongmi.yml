name: Follow FongMi kernel

# Auto-detect FongMi/mpv (fongmi branch) updates and rebuild.
# No manual operation required: when the kernel advances, this workflow
# records the new SHA (push to fongmi-kernel) which triggers the Build APK
# workflow (on: push) to recompile the native libraries against the latest
# FongMi/mpv source.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fongmi-kernel
          fetch-depth: 1

      - name: Check FongMi/mpv (fongmi) for updates
        id: fongmi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW=$(gh api repos/FongMi/mpv/commits/fongmi --jq .sha)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          OLD=$(cat .fongmi_kernel_sha 2>/dev/null || echo "")
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          if [ "$NEW" != "$OLD" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record new SHA and trigger rebuild
        if: steps.fongmi.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ steps.fongmi.outputs.new }}" > .fongmi_kernel_sha
          git config user.email "fongmi-sync[bot]@users.noreply.github.com"
          git config user.name "fongmi-sync[bot]"
          git add .fongmi_kernel_sha
          git commit -m "chore: fongmi kernel -> ${{ steps.fongmi.outputs.new }}"
          git push
          echo "FongMi/mpv updated: ${{ steps.fongmi.outputs.old }} -> ${{ steps.fongmi.outputs.new }}; rebuild triggered via push."

      - name: No update
        if: steps.fongmi.outputs.changed != 'true'
        run: echo "FongMi/mpv (fongmi) already at latest (${{ steps.fongmi.outputs.new }}); no rebuild."
